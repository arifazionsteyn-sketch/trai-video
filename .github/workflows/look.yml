# Кадры разделов сайта (для роликов и витрины). Только ручной запуск.
name: look
on:
  workflow_dispatch:
    inputs:
      views: { description: 'разделы через запятую', default: 'watch' }
      size: { description: 'ширина x высота', default: '1920x1080' }
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright@1 && npx playwright install --with-deps chromium
      - env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: NODE_PATH=/tmp/pw/node_modules node video/look.cjs look_out "${{ inputs.views }}" "${{ inputs.size }}"
      - name: Кадры в ветку look-out
        run: |
          cd look_out && git init -q -b look-out && git add -A && git -c user.name=bot -c user.email=bot@trai commit -qm look
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" look-out
