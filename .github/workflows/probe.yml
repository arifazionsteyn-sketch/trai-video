# Разовая проверка данных (только чтение) → ветка probe-out
name: probe
on:
  push:
    branches: [main]
    paths: ['video/probe.cjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env: { TG_BOT_TOKEN: '${{ secrets.TG_BOT_TOKEN }}' }
        run: node video/probe.cjs
      - run: |
          cd probe && git init -q && git checkout -q -b probe-out && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
