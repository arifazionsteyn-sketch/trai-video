# Разовая проверка ключей: только «есть / нет» и код ответа сервиса, сами ключи и данные не печатаются
name: keys
on:
  push:
    paths: ['.github/workflows/keys.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          MARKETAUX_KEY: ${{ secrets.MARKETAUX_KEY }}
          LOGODEV_KEY: ${{ secrets.LOGODEV_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for k in FINNHUB_KEY MARKETAUX_KEY LOGODEV_KEY ANTHROPIC_API_KEY GEMINI_API_KEY; do v="${!k}"; if [ -n "$v" ]; then echo "$k: есть (длина ${#v})"; else echo "$k: НЕТ"; fi; done
          [ -n "$FINNHUB_KEY" ] && echo "Finnhub: HTTP $(curl -s -o /tmp/f.json -w '%{http_code}' "https://finnhub.io/api/v1/quote?symbol=AAPL&token=$FINNHUB_KEY"), цена в ответе: $(python3 -c "import json;print('да' if json.load(open('/tmp/f.json')).get('c') else 'нет')" 2>/dev/null)"
          [ -n "$MARKETAUX_KEY" ] && echo "Marketaux: HTTP $(curl -s -o /tmp/m.json -w '%{http_code}' "https://api.marketaux.com/v1/news/all?symbols=AAPL&limit=1&language=en&api_token=$MARKETAUX_KEY"), новостей в ответе: $(python3 -c "import json;print(len(json.load(open('/tmp/m.json')).get('data',[])))" 2>/dev/null)"
          [ -n "$LOGODEV_KEY" ] && echo "Logo.dev: HTTP $(curl -s -o /tmp/l.bin -w '%{http_code} %{content_type}' "https://img.logo.dev/apple.com?token=$LOGODEV_KEY&size=128&format=png")"
          true
