# Каждые 5 минут просит сайт собрать свежие новости (бесплатно: публичный репозиторий).
# Здесь нет кода сайта: только адрес и секретный код из секретов репозитория.
name: news-live
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: news-live
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Позвать сайт
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Нет секретов SITE_URL / CRON_SECRET"; exit 1; fi
          code=$(curl -sS -m 90 -o out.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron?job=news" || true)
          echo "HTTP $code"; head -c 400 out.json; echo
          [ "$code" = "200" ]
